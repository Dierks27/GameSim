[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gridsim"
version = "2026.11.12"
description = "NFL single-game Monte Carlo simulator built on resampled nflverse play-by-play"
requires-python = ">=3.11"
dependencies = [
  "nflreadpy>=0.1.5",
  "polars>=1.0",
  "pyarrow>=14",
  "numpy>=1.26",
  "scipy>=1.11",
  "plotly>=5.20",
  "streamlit>=1.40",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "optuna>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gridsim = "gridsim.cli:main"

[tool.setuptools]
packages = ["gridsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running league-level checks (deselect with -m 'not slow')"]
