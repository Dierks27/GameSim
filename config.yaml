# gridsim configuration. Every tunable lives here; see DECISIONS.md for why each default was chosen.
# The config hash printed in reports/backtests is computed from this file's parsed contents.

data:
  cache_dir: data/cache
  refresh_hours: 12            # re-download the current season if the cached parquet is older than this
  seasons_back: 1              # prior seasons included in addition to the target season
  season_weights: [1.0, 0.35]  # weight for target season, then 1, 2, ... seasons back (weighted sampling)
  week_decay: 1.0              # within the target season, a play k weeks before the cutoff gets weight decay^k
  include_postseason: true     # postseason plays from prior seasons are included (same weight as their season)
  garbage_time:                # dropped from tendency (play call) and outcome pools only
    quarters: [4]
    wp_low: 0.05
    wp_high: 0.95
    apply_to_playcall: true    # also drop garbage time from play-call tendencies (spec default)

kickoff_rules:
  # Kickoff outcomes come only from seasons in the same rules era as the simulated season.
  # 2024 = first dynamic kickoff year (touchback to 30); 2025 = touchback to 35;
  # 2026 = onside allowed any time + 5-3-2 return alignment.
  eras: {2023: legacy, 2024: dk2024, 2025: dk2025, 2026: dk2026}
  default_era: dk2026          # used for seasons not listed (future seasons)
  min_era_kickoffs: 400        # if the era has fewer weighted kickoffs than this, add the previous era
  touchback_yardline: {legacy: 25, dk2024: 30, dk2025: 35, dk2026: 35}   # per era: receiving team's yard line after an end-zone touchback
  landing_zone_touchback_yardline: 20
  safety_kick_shift: 10        # free kick after a safety: receiving team starts this many yards better

sim:
  n_sims: 2000
  seed: 42
  w_off: 0.5                   # matchup blend: P(sample from offense's own plays) vs plays the defense allowed
  min_bucket_n: 40             # weighted plays needed before a team bucket level is used
  k_outcome: 60                # team_weight = n / (n + k) at the chosen team bucket level
  k_presnap: 400               # shrinkage of team pre-snap foul rates (snaps)
  league_min_n: 40             # weighted plays needed before a league bucket level is used
  td_censoring_fix: true
  # Additive matchup correction (see DECISIONS.md): the off/def mixture halves matchup effects, so sampled
  # rows are EPA-tilted until the mixture's mean shift = matchup_strength * (shrunk off effect + def effect).
  matchup_strength: 1.0        # 0 disables the correction (pure spec mixture)
  k_team_epa: 300              # shrinkage of team/QB EPA-per-play effects (plays)       # Kaplan-Meier extension of TD plays sampled from closer to the goal line

playcall:
  smoothing_m: 25              # hierarchical additive smoothing strength for league P(pass) cells
  k_team_pass: 300             # shrinkage of team pass-rate-over-expected offsets (plays)
  k_team_4th: 60               # shrinkage of team 4th-down aggressiveness offsets (4th downs)
  fg_min_make_prob: 0.30       # never attempt a FG with lower kicker-specific make probability
  pass_logit_shift: 0.0        # global calibration of P(pass) in logit units (diagnose: pass_rate bias)

kicking:
  k_kicker: 15                 # prior information (in logit-Fisher units) for kicker offsets; larger = shrink harder
  fg_seasons_back: 3           # FG/XP/2pt league models use more seasons for stability
  k_punter: 60                 # punts; shrinkage of punting team net-yard offset
  k_kickoff_team: 150          # kickoffs; shrinkage of kicking team field-position offset
  block_return_td_rate: 0.08   # P(return TD | blocked FG); blocked FGs otherwise go to the spot

two_point:
  # Go for 2 when (score diff after the TD, before the try) is in this list, from quarter >= late_quarter.
  late_quarter: 4
  chart: [-2, -5, -10, -13, 1, 5, 12]
  base_rate: 0.04              # random 2-pt attempt rate outside the chart (league tendency)

clock:
  hurry_q4_seconds: 300        # trailing offense in hurry-up in the last N seconds of Q4/OT
  hurry_q4_two_score_seconds: 600
  hurry_q2_seconds: 120        # every offense hurries in the last N seconds of the first half
  milk_q4_seconds: 300         # leading offense drains the play clock in the last N seconds
  milk_q4_two_score_seconds: 600
  def_timeout_seconds: 165     # trailing defense starts using timeouts when <= N game seconds remain (Q4/OT)
  def_timeout_max_deficit: 16
  off_timeout_seconds: 75      # hurrying offense uses timeouts after in-bounds plays when <= N half seconds
  spike_seconds: 40            # hurrying offense with no timeouts spikes when <= N seconds and clock running
  q2_kneel_seconds: 35         # first half: kneel out when <= N seconds and the ball is in own territory
  k_pace: 150                  # shrinkage (running-clock snaps) of team neutral-pace factors
  runoff_scale: 1.03           # global multiplier on between-snap runoff (calibrated, see DECISIONS.md)

qb:
  # Team-specific dropback samples come from the starting QB's own dropbacks (any team, in the window) with
  # weight n/(n + k_qb); the rest from a league pool of low-sample/backup QBs.
  k_qb: 100
  backup_max_dropbacks: 150    # weighted dropbacks; QBs below this form the backup pool

availability:
  questionable_play_prob: 0.75
  doubtful_out: true
  doubtful_play_prob: 0.10      # used only when doubtful_out is false
  no_report_dnp_play_prob: 0.5  # no game status yet, last practice DNP
  no_report_limited_play_prob: 0.95
  practice_dnp_factor: 0.67     # Questionable + last practice DNP -> 0.75 * 0.67
  practice_full_factor: 1.15    # Questionable + full practice (capped at 0.95)
  stale_injury_hours: 24

home_field:
  # Exponential tilt of scrimmage outcome sampling by EPA: home offense weights *= exp(+tilt*epa),
  # away offense weights *= exp(-tilt*epa). Calibrated in the backtest (see DECISIONS.md).
  tilt: 0.006

regime:
  file: regime_changes.yaml    # list of {team: MIN, date: 2026-10-20, note: "new OC calls plays"}
  pre_change_weight: 0.3       # multiplier on that team's pre-change plays for play-call tendencies only

rest_travel:
  # Small game-level edges in points of margin, converted to EPA/play shifts (half to each side).
  strength: 1.0                # tunable scale; 0 disables
  bye_pts: 0.6                 # coming off a bye (rest >= 13 days)
  short_week_pts: -0.6         # rest <= 5 days (Thursday after Sunday)
  rest_diff_pts_per_day: 0.0   # extra edge per day of rest advantage (capped at 3 days)
  tz_pts_per_hour: -0.25       # per time zone travelled by the visitor (east-west), up to 3
  international_pts: 0.0       # both teams travel; usually 0
  plays_per_team: 62

weather:
  enabled: true
  strength: 1.0                # scales the fitted (ridge-shrunk) wind/cold/precip effects; tunable

overtime:
  regular_season_minutes: 10
  playoff_minutes: 15
  coin_toss_winner_receives: 0.97   # P(toss winner elects to receive)

players:
  usage_games: 6               # recent games used for usage shares
  k_player_eff: 80             # shrinkage of per-player yards-per-touch efficiency (touches)
  min_share: 0.01

backtest:
  out_dir: backtests

tune:
  sims_per_game: 300
  seed: 2024
  weeks: [3, 18]               # train weeks per season (weeks 1-2 have almost no current-season data)
  validate_weeks: [3, 18]
  train_every_kth_game: 2      # keep every k-th game (deterministic) to speed up trials
  trials: 150
  objective_weights: {log_loss: 1.0, crps_margin: 1.0, crps_total: 1.0}
  # Keep this list short: every knob is room to overfit.
  space:
    sim.k_outcome: {low: 15, high: 400, log: true}
    sim.w_off: {low: 0.3, high: 0.7}
    sim.matchup_strength: {low: 0.4, high: 1.4}
    sim.k_team_epa: {low: 60, high: 1500, log: true}
    data.season_weights.1: {low: 0.1, high: 0.8}
    data.week_decay: {low: 0.85, high: 1.0}
    home_field.tilt: {low: 0.0, high: 0.03}
    kicking.k_kicker: {low: 3, high: 80, log: true}
    playcall.k_team_4th: {low: 10, high: 400, log: true}
    clock.runoff_scale: {low: 0.97, high: 1.09}
    playcall.pass_logit_shift: {low: -0.2, high: 0.1}
    weather.strength: {low: 0.0, high: 1.5}
    rest_travel.strength: {low: 0.0, high: 2.0}

markets:
  # READ-ONLY market data. gridsim never places orders and never uses exchange account keys.
  kalshi:
    enabled: true
    base_url: https://api.elections.kalshi.com/trade-api/v2   # Kalshi public market data (confirm in Kalshi docs)
    timeout: 15
    # Kalshi quadratic fee: ceil_to_cent(rate * contracts * P * (1 - P)) * fee_multiplier (verify vs kalshi.com fee schedule)
    taker_fee_rate: 0.07
    maker_fee_rate: 0.0175
    fee_multiplier: 1.0
    series_title_patterns:      # discovery by series title (no hard-coded tickers)
      moneyline: "Pro Football Game"
      spread: "Pro Football Spread"
      total: "Pro Football Total Points|Total Points"
    series_fallback: {moneyline: KXNFLGAME, spread: KXNFLSPREAD, total: KXNFLTOTAL}

scanner:
  min_edge: 0.04               # edge after fees, in probability points
  moe_multiple: 2.0            # edge must also exceed this many sim margins of error (else re-sim with more sims)
  max_resim_sims: 20000
  min_depth_dollars: 250       # size available at the quoted price
  max_spread: 0.04             # bid/ask spread
  min_volume: 1000             # contracts traded
  max_sim_age_hours: 6
  trust_min_graded: 50         # graded signals needed before a market type may alert
  realert_edge_growth: 0.03    # re-alert only if the edge grows this much, or flips/disappears
  strong_edge: 0.08
  key_questionable_positions: [QB]
  schedule_note: "game weeks: every 30 min Thu-Sun, every 10 min in the last 3 h before kickoff"

notify:
  ntfy_topic_env: NTFY_TOPIC             # read from .env / environment, never committed
  discord_webhook_env: DISCORD_WEBHOOK_URL
  windows_toast: true
